name: streamgrid_flutter_app
description: Aesthetic TikTok-style native Flutter mobile application powered by Titan reactive state management, 12-color dynamic theming, Day/Night mode, and connected to https://github.dev.
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  titan: ^0.2.0
  titan_bastion: ^0.2.0
  http: ^1.2.2
  video_player: ^2.9.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
